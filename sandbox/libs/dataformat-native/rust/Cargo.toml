[workspace]
resolver = "2"
members = [
    "common",
    "macros",
    "lib",
    "../../../plugins/analytics-backend-datafusion/rust",
    "../../../plugins/parquet-data-format/src/main/rust",
    "../../../plugins/native-repository-s3/src/main/rust",
    "../../../plugins/native-repository-gcs/src/main/rust",
    "../../../plugins/native-repository-azure/src/main/rust",
    "../../../plugins/native-repository-fs/src/main/rust",
    "../../../libs/tiered-storage/src/main/rust",
    "../../../plugins/block-cache-foyer/src/main/rust",
]

[workspace.dependencies]
# Arrow / Parquet
#
# 59.1.0 is the release DataFusion `main` pins, and it is the first release
# containing every ParquetPushDecoder row-group boundary API the indexed scan
# path needs (`is_at_row_group_boundary`, `row_groups_remaining`,
# `peek_next_row_group`, `into_builder`). That is why there is no longer a
# `[patch.crates-io]` block below: the Arrow fork existed solely to carry those
# APIs ahead of a release.
arrow = { version = "=59.1.0", features = ["ffi"] }
arrow-array = "=59.1.0"
arrow-ipc = "=59.1.0"
arrow-schema = "=59.1.0"
arrow-buffer = "=59.1.0"
parquet = "=59.1.0"

# DataFusion
#
# Tracks DataFusion `main` rather than a crates.io release because the indexed
# scan path depends on `RowGroupAccessProvider`, which is not in 54.0.0. Every
# `datafusion*` crate must resolve to the same source, so all of them are
# pinned to one revision here (mixing a git crate with a crates.io crate would
# give two incompatible copies of the same Arrow-facing types).
#
# Repoint to a crates.io version once a release contains
# `RowGroupAccessProvider`.
datafusion = { git = "https://github.com/apache/datafusion.git", rev = "7ca6e543ec30ab0413b75171747a6d39ac0b0537" }
datafusion-expr = { git = "https://github.com/apache/datafusion.git", rev = "7ca6e543ec30ab0413b75171747a6d39ac0b0537" }
datafusion-datasource = { git = "https://github.com/apache/datafusion.git", rev = "7ca6e543ec30ab0413b75171747a6d39ac0b0537" }
datafusion-common = { git = "https://github.com/apache/datafusion.git", rev = "7ca6e543ec30ab0413b75171747a6d39ac0b0537" }
datafusion-execution = { git = "https://github.com/apache/datafusion.git", rev = "7ca6e543ec30ab0413b75171747a6d39ac0b0537" }
datafusion-physical-expr = { git = "https://github.com/apache/datafusion.git", rev = "7ca6e543ec30ab0413b75171747a6d39ac0b0537" }
datafusion-physical-expr-adapter = { git = "https://github.com/apache/datafusion.git", rev = "7ca6e543ec30ab0413b75171747a6d39ac0b0537" }
datafusion-substrait = { git = "https://github.com/apache/datafusion.git", rev = "7ca6e543ec30ab0413b75171747a6d39ac0b0537" }

# Async
tokio = { version = "=1.52.3", features = ["full"] }
tokio-util = "=0.7.18"
futures = "=0.3.32"
tokio-stream = "=0.1.18"

# Serialization
prost = "=0.14.3"
substrait = "=0.63.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

# Logging
log = "=0.4.29"

# Allocator
# disable_initial_exec_tls: Required because this library is loaded at runtime via dlopen/JVM FFM.
# Without it, jemalloc uses initial-exec TLS which fails on aarch64 Linux with:
#   "cannot allocate memory in static TLS block"
# The feature switches to global-dynamic TLS model, compatible with runtime loading.
tikv-jemallocator = { version = "=0.6.1", features = ["disable_initial_exec_tls", "profiling"] }
tikv-jemalloc-ctl = { version = "=0.6.1", features = ["stats"] }
tikv-jemalloc-sys = { version = "=0.6.1", features = ["stats"] }

# Misc
dashmap = { version = "=5.5.3", features = ["raw-api", "serde"] }
num_cpus = "=1.17.0"
object_store = "=0.13.2"
url = "=2.5.8"
tempfile = "=3.27.0"
chrono = "=0.4.45"
once_cell = "=1.21.4"
crc32fast = "=1.5.0"
parking_lot = "=0.12.5"
lazy_static = "=1.5.0"
rayon = "=1.11.0"
thiserror = "=1.0.69"
async-trait = "=0.1.89"
bytes = "=1.11.1"
criterion = { version = "=0.5.1", features = ["async_tokio"] }
tokio-metrics = { version = "=0.5.0", features = ["rt"] }
proptest = "=1.4.0"

# Internal
native-bridge-common = { path = "common" }
opensearch-tiered-storage = { path = "../../tiered-storage/src/main/rust" }
opensearch-repository-s3 = { path = "../../../plugins/native-repository-s3/src/main/rust" }
opensearch-repository-gcs = { path = "../../../plugins/native-repository-gcs/src/main/rust" }
opensearch-repository-azure = { path = "../../../plugins/native-repository-azure/src/main/rust" }
opensearch-repository-fs = { path = "../../../plugins/native-repository-fs/src/main/rust" }

[profile.release]
lto = true
codegen-units = 1
incremental = true
debug = "line-tables-only"
strip = false

[profile.dev]
opt-level = 1
lto = false
codegen-units = 16
incremental = true
debug = "full"
strip = false

# NOTE: no `[patch.crates-io]` Arrow block.
#
# It previously pinned 15 Arrow/Parquet packages to a fork carrying the
# ParquetPushDecoder row-group boundary APIs (arrow-rs #9804, #9968, #10158)
# ahead of a release. All three are in released Arrow/Parquet 59.1.0, so the
# fork is gone. Keep it that way: a workspace-wide patch forces every Arrow
# package to move together and makes Arrow and DataFusion upgrades a single
# coupled change.
#
# While DataFusion is a git dependency, point it at a local checkout with
# `.cargo/config.toml` rather than reintroducing a patch table here:
#
#   [patch."https://github.com/apache/datafusion.git"]
#   datafusion = { path = "../../../../../datafusion/datafusion/core" }
#   # ...one entry per datafusion* crate
