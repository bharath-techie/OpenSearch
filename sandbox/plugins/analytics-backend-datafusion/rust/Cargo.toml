[package]
# DataFusion analytics backend native library
name = "opensearch-datafusion"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
workspace = "../../../libs/dataformat-native/rust"

[lib]
name = "opensearch_datafusion"
crate-type = ["rlib"]

[dependencies]
libc = "0.2"
datafusion = { workspace = true }
datafusion-expr = { workspace = true }
datafusion-datasource = { workspace = true }
datafusion-common = { workspace = true }
datafusion-execution = { workspace = true }
datafusion-substrait = { workspace = true }

arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }

parquet = { workspace = true }
object_store = { workspace = true }
url = { workspace = true }

prost = { workspace = true }
substrait = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
tokio-stream = { workspace = true }
parking_lot = { workspace = true }
once_cell = { workspace = true }
dashmap = { workspace = true }
log = { workspace = true }
num_cpus = { workspace = true }
native-bridge-common = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
roaring = "=0.10.12"
thiserror = { workspace = true }

# convert_tz UDF
chrono-tz = "=0.10.4"

tokio-metrics = { workspace = true }

# tokio-console support — OFF by default. Build with
#   RUSTFLAGS="--cfg tokio_unstable" cargo build --features tokio-console
# (console-subscriber needs the tokio_unstable cfg). When enabled,
# RuntimeManager::new() starts the console gRPC server (default 127.0.0.1:6669)
# so `tokio-console` can attach and show per-task poll/scheduled/idle durations.
# `tracing` is a base dependency (already in the graph via datafusion/object_store)
# so operator-level spans (#[tracing::instrument]) can live in the hot path
# unconditionally. Spans are near-zero-cost when no subscriber is installed
# (the default build installs none). The OTLP/console subscribers below are what
# actually collect and export them, and those stay feature-gated.
tracing = "0.1"
console-subscriber = { version = "0.5", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }

# tracing-otel: export tracing spans over OTLP/gRPC to Jaeger for a browser
# span-waterfall UI. OFF by default; enable with `--features tracing-otel`.
# Run Jaeger (UI http://localhost:16686, OTLP intake :4317); the exporter
# endpoint is configurable via OTEL_EXPORTER_OTLP_ENDPOINT.
# datafusion-tracing: auto-instruments every physical operator (scan/filter/agg/
# repartition) with tracing spans carrying native metrics (output rows, elapsed
# compute). Version tracks datafusion 1:1 -> 54.0.0 for datafusion 54. Spans nest
# under our execute_query span, giving the per-operator Jaeger waterfall.
datafusion-tracing = { version = "54.0.0", optional = true }
tracing-opentelemetry = { version = "0.31", optional = true }
opentelemetry = { version = "0.30", optional = true }
opentelemetry_sdk = { version = "0.30", optional = true, features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.30", optional = true, features = ["grpc-tonic"] }

# serde_json `preserve_order` — backs `Map<String,Value>` with `IndexMap`
# instead of `BTreeMap` so json_keys / mutation UDFs see object keys in
# insertion order (parity with legacy SQL-plugin's LinkedHashMap; required by
# `testJsonKeysParityWithLegacy` + byte-for-byte json_extract fixtures).
# Cargo's feature unification propagates this to every workspace member that
# pulls in serde_json. Audit (2026-05-07): the five other consumers
# (parquet-data-format, native-repository-{s3,gcs,azure,fs}) only call
# `serde_json::from_str` into typed config structs, whose field layout is
# fixed at the type level — `preserve_order` is inert for them, so the
# feature is additive with no observable blast radius outside this crate.
serde_json = { workspace = true, features = ["preserve_order"] }
# jsonpath-rust 0.7 — JSONPath evaluator for json_extract. Published at
# https://github.com/besok/jsonpath-rust (crates.io). We pin `0.7` (latest
# `0.7.5`) rather than tracking the newer `1.0` release line because 0.7's
# `JsonPathValue` enum exposes the Found/NoValue distinction json_extract
# relies on to render missing-path matches as literal `null` elements in the
# multi-path JSON-array output. Moving to 1.x is a follow-up once we can
# reproduce that distinction against the new API surface.
jsonpath-rust = "=0.7.5"
# mvfind / parse / rex_extract / rex_extract_multi / rex_offset UDFs — Java-Pattern-compatible
# regex matching. Same crate DataFusion's own regexp_replace / regexp_match are
# built on, so semantics match the existing analytics-engine route's
# `regex_match` operator (Operator::RegexMatch).
regex = "=1.12.3"

# grok UDF — the resolved grok dictionary patterns (e.g. BASE10NUM, IPV4) use
# lookbehind `(?<!…)` and atomic groups `(?>…)` that the RE2-based `regex` crate
# rejects. `fancy-regex` wraps `regex` with a backtracking engine that supports
# those constructs (plus lookahead), matching java.util.regex's feature set that
# the SQL plugin's grok library relies on. Only used by src/udf/grok.rs.
fancy-regex = "=0.14.0"

# Cryptographic hash UDFs. `sha1` is a dedicated crate (RFC 3174); DataFusion
# only exposes SHA-2 variants via its `digest` UDF. `crc32fast` is a SIMD-accelerated
# IEEE 802.3 CRC-32 implementation used by `crc32`; also pulled in via workspace
# for parquet metadata (`crc32fast = "1.4"`) so adding it here is a zero-cost alias.
sha1 = "0.11"
crc32fast = { workspace = true }

# `base64` for the binary_to_base64 UDF — output of CAST(<BinaryType> AS VARCHAR)
# rewrite. STANDARD alphabet matches the OpenSearch `binary` field wire contract.
base64 = "0.22"

[features]
# Enable the tokio-console gRPC server in RuntimeManager. Requires building with
# RUSTFLAGS="--cfg tokio_unstable". Off by default — zero impact on normal builds.
tokio-console = ["dep:console-subscriber", "dep:tracing-subscriber"]
tracing-otel = [
    "dep:tracing-subscriber",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:datafusion-tracing",
]
# dial9 is Linux-only (cpu-profiling). On non-Linux the feature still toggles but
# the optional dep is absent, so the code is additionally #[cfg(target_os="linux")]-gated.
dial9 = ["dep:dial9-tokio-telemetry"]

[dev-dependencies]
criterion = { workspace = true }
tempfile = { workspace = true }
rand = "=0.8.6"
proptest = { workspace = true }

[[bench]]
name = "query_bench"
harness = false

[[bench]]
name = "memory_budget_bench"
harness = false

[[bench]]
name = "memory_pressure_bench"
harness = false

[[bench]]
name = "cross_rt_throughput_bench"
harness = false

[[bench]]
name = "row_id_bench"
harness = false

# dial9: post-hoc tokio telemetry — records per-poll/park/wake events + CPU
# flamegraphs + schedule profiling to a self-describing trace file, viewed in a
# browser via `dial9 serve`. OFF by default; LINUX-ONLY (cpu-profiling). Enable
# with `--features dial9` and build with
# RUSTFLAGS="--cfg tokio_unstable -C force-frame-pointers=yes".
# Placed in a target table (not the main [dependencies]) so the crate is only
# pulled on Linux; the code is additionally #[cfg(target_os = "linux")]-gated.
[target.'cfg(target_os = "linux")'.dependencies]
dial9-tokio-telemetry = { version = "0.3", optional = true, features = ["cpu-profiling"] }
